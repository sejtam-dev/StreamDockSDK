<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Counter Settings</title>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="Common/styles.css" rel="stylesheet">
    <script src="Common/sdpi.js"></script>
</head>
<body>
<div class="sdpi-wrapper">
    <div class="mb-3">
        <label for="startValue" class="form-label" data-i18n="counter.startValue"></label>
        <input class="form-control" id="startValue" min="0" data-i18n-placeholder="counter.startValue" placeholder="Initial counter value" type="number" value="0">
        <div class="info-text" data-i18n="counter.startValueInfo"></div>
    </div>

    <div class="mb-3">
        <label for="increment" class="form-label" data-i18n="counter.increment"></label>
        <input class="form-control" id="increment" min="1" data-i18n-placeholder="counter.increment" placeholder="Increment amount" type="number" value="1">
        <div class="info-text" data-i18n="counter.incrementInfo"></div>
    </div>

    <div class="section-divider">
        <div class="line"></div>
        <span class="text" data-i18n="counter.options"></span>
        <div class="line"></div>
    </div>

    <div class="mb-3">
        <div class="form-check">
            <input class="form-check-input" id="resetOnAppear" type="checkbox">
            <label class="form-check-label" for="resetOnAppear" data-i18n="counter.resetOnAppear"></label>
        </div>
    </div>

    <div class="hint mb-3">
        <i class="bi bi-info-circle-fill"></i>
        <span data-i18n="counter.hint"></span>
    </div>

    <div class="mb-3">
        <button class="btn btn-danger w-100" id="resetBtn">
            <i class="bi bi-arrow-counterclockwise"></i> <span data-i18n="counter.resetButton"></span>
        </button>
    </div>
</div>

<script crossorigin="anonymous"
        integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="counter.js"></script>
</body>
</html>
