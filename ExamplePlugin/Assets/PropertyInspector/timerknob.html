<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Timer Knob Settings</title>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="Common/styles.css" rel="stylesheet">
    <script src="Common/sdpi.js"></script>
</head>
<body>
<div class="sdpi-wrapper">
    <div class="mb-3">
        <label for="duration" class="form-label" data-i18n="timerknob.duration"></label>
        <div class="d-flex align-items-center">
            <input type="range" class="form-range flex-grow-1" id="duration" min="1" max="60" value="5">
            <span class="ms-3 fw-bold" id="durationValue">5 min</span>
        </div>
        <div class="info-text" data-i18n="timerknob.durationInfo"></div>
    </div>

    <div class="section-divider">
        <div class="line"></div>
        <span class="text" data-i18n="timerknob.status"></span>
        <div class="line"></div>
    </div>

    <div class="mb-3">
        <div class="form-check">
            <input class="form-check-input" type="checkbox" id="isRunning" disabled>
            <label class="form-check-label" for="isRunning" data-i18n="timerknob.isRunning"></label>
        </div>
        <div class="info-text" data-i18n="timerknob.isRunningInfo"></div>
    </div>

    <div class="mb-3">
        <button class="btn btn-danger w-100" id="resetButton">
            <i class="bi bi-arrow-counterclockwise"></i> <span data-i18n="timerknob.resetButton"></span>
        </button>
    </div>

    <div class="hint mb-3">
        <i class="bi bi-info-circle-fill"></i>
        <div>
            <strong data-i18n="timerknob.hint.title"></strong><br>
            • <span data-i18n="timerknob.hint.rotate">R</span><br>
            • <span data-i18n="timerknob.hint.shortPress"></span><br>
            • <span data-i18n="timerknob.hint.longPress"></span><br>
            <br>
            <strong data-i18n="timerknob.hint.note"></strong>
        </div>
    </div>
</div>

<script crossorigin="anonymous"
        integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="timerknob.js"></script>
</body>
</html>
